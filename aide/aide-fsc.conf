# AIDE-Konfiguration fuer den Werkzeugvergleich
# Ueberwacht ausschliesslich das Testverzeichnis /opt/fsc-test

# Referenzdatenbank: Beim Scan wird gegen aide-fsc.db geprueft,
# eine neue Datenbank wird nach aide-fsc.db.new geschrieben
database_in=file:/var/lib/aide/aide-fsc.db
database_out=file:/var/lib/aide/aide-fsc.db.new
database_new=file:/var/lib/aide/aide-fsc.db.new

# Datenbank unkomprimiert, damit sie direkt lesbar bleibt
gzip_dbout=no

# Bericht auf die Standardausgabe, nur geaenderte Attribute anzeigen
report_url=stdout
report_level=changed_attributes

# Zu pruefende Attribute:
#   p = Zugriffsrechte (erkennt auch das SUID-Bit)
#   u = Eigentuemer (User)
#   g = Gruppe
#   s = Dateigroesse
#   i = Inode-Nummer
#   n = Anzahl der Hardlinks
#   sha256 = Pruefsumme des Dateiinhalts
FSCRULE = p+u+g+s+i+n+sha256

# Regel auf das Testverzeichnis anwenden
/opt/fsc-test FSCRULE
