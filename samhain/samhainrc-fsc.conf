# Samhain-Konfiguration fuer den Werkzeugvergleich
# Ueberwacht ausschliesslich das Testverzeichnis /opt/fsc-test

[ReadOnly]
# ReadOnly prueft alle Attribute ausser Zugriffszeit:
# Rechte (inkl. SUID-Bit), Eigentuemer, Gruppe, Groesse,
# Inode, Hardlinks, Aenderungszeit und Pruefsumme
dir=99/opt/fsc-test

[Log]
# Protokollierung in eine eigene Datei, damit die Messungen
# nicht mit Systemmeldungen vermischt werden
LogSeverity=info
LogFile=/var/lib/samhain/samhain-fsc.log

[Misc]
# Datenbank und Ausgabe fuer diese Konfiguration
SetDatabasePath=/var/lib/samhain/samhain-fsc.file
SetLogfilePath=/var/lib/samhain/samhain-fsc.log
SetLockfilePath=/var/run/samhain-fsc.pid

# Zusatzmodule deaktivieren, damit nur das Testverzeichnis
# ueberwacht wird und die Messungen vergleichbar bleiben
[SuidCheck]
SuidCheckActive=no

[ProcessCheck]
ProcessCheckActive=no

[PortCheck]
PortCheckActive=no

[Utmp]
LoginCheckActive=no
