{
  "options": {
    "disable_events": "false",
    "enable_file_events": "true",
    "logger_path": "/var/log/osquery",
    "schedule_splay_percent": "10"
  },

  "file_paths": {
    "fsc_test": [
      "/opt/fsc-test/%%"
    ]
  },

  "schedule": {
    "file_events": {
      "query": "SELECT * FROM file_events;",
      "interval": 10,
      "description": "Aenderungen im Testverzeichnis abfragen"
    }
  }
}
